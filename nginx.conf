server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
  gzip_min_length 1024;
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; add_header Accept-Ranges bytes; }
  location / { add_header Cache-Control "no-cache"; try_files $uri $uri/ /index.html; }
  types { audio/ogg ogg; video/mp4 mp4; font/woff2 woff2; }
}
